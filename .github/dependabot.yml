version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # npm dependencies, including the wrangler CLI used to deploy. Minor and
  # patch updates are grouped so each month is one PR. Major versions are
  # skipped here because they usually need code changes; upgrade those in a
  # dedicated PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
